name: Deploy Vite site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check website
        run: npm run typecheck

      - name: Lint website
        run: npm run lint

      - name: Build website
        run: npm run build

      - name: Verify requested website features
        run: node scripts/requirements-check.mjs

      - name: Check preinstalled Chrome
        run: google-chrome --version

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/myweb/ > /dev/null; then
              break
            fi
            sleep 1
          done

      - name: Verify homepage renders in a real browser
        run: node scripts/smoke-test.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: https://riobase.github.io/myweb/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for the branch-based Pages deployment
        run: sleep 90

      - name: Publish the compiled Vite website last
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out the browser smoke test
        uses: actions/checkout@v4

      - name: Allow Pages to serve the new deployment
        run: sleep 20

      - name: Verify the live website in Chrome
        env:
          TEST_BASE_URL: https://riobase.github.io/myweb/
        run: node scripts/smoke-test.mjs
